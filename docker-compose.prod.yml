# Production-style stack: HTTPS in front, database not published, health checks, restart policies.
#   cp .env.production.example .env.production   (fill in the secrets)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: carecircle
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carecircle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-carecircle}
    volumes: ["pgdata:/var/lib/postgresql/data", "./backups:/backups"]
    networks: [internal]          # no published port: only the app can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carecircle} -d ${POSTGRES_DB:-carecircle}"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: carecircle-app:${APP_TAG:-latest}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carecircle}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carecircle}
      GIT_SHA: ${GIT_SHA:-dev}
      FORWARDED_ALLOW_IPS: "*"   # Caddy is the only thing that can reach the app, so trust its client IP and scheme
    depends_on:
      db: {condition: service_healthy}
    expose: ["8000"]
    networks: [internal, web]     # internal for the database, web for Caddy and the AI providers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on:
      app: {condition: service_healthy}
    networks: [web]
volumes:
  pgdata:
  caddy_data:
  caddy_config:
networks:
  internal:
    internal: true                # no route to the internet; the database stays private
  web:
