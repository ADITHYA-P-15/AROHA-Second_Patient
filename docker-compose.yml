services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secondpatient
      POSTGRES_PASSWORD: secondpatient
      POSTGRES_DB: secondpatient
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondpatient -d secondpatient"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://secondpatient:secondpatient@db:5432/secondpatient
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  pgdata:
